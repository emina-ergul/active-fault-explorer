services:
  database:
    image: postgis/postgis:17-3.5
    container_name: seismic_database
    environment:
      POSTGRES_DB: seismic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: